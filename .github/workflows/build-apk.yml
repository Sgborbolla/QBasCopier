name: Compilar APK QBasWing Shuttle

on:
  workflow_dispatch:          # boton "Run workflow" en la pestana Actions
    inputs:
      publicar:
        description: 'Publicar el release. Dejalo en NO mientras la app este a medias.'
        type: boolean
        default: false
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar .NET SDK 8 (LTS, Android estable)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Fijar SDK 8 para el build (el runner preinstala 9/10 y se adelantan)
        run: |
          set -e
          for d in /usr/share/dotnet/sdk/*; do
            [ -d "$d" ] || continue
            case "$(basename "$d")" in
              8.*) continue ;;
              *) sudo rm -rf "$d" ;;
            esac
          done
          dotnet --list-sdks
          [ "$(dotnet --version | cut -d. -f1)" = "8" ] || { echo "FALLO: no quedó el SDK 8"; exit 1; }

      - name: Instalar workload android (JDK y Android SDK se descargan solos)
        run: dotnet workload install android

      - name: Compilar el APK
        run: |
          set -o pipefail
          dotnet build "QBasCopier.Android/QBasCopier.Android.csproj" -c Release -t:SignAndroidPackage 2>&1 | tee /tmp/build.log

      - name: Subir el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: QBasWing-Shuttle-v1.2-apk
          path: QBasCopier.Android/bin/Release/net8.0-android*/*.apk
          if-no-files-found: error

      - name: Publicar el APK en un release
        # Solo si alguien lo pide a mano. Antes esto iba en cada push y subia una
        # APK sin terminar al release, que es justo lo que no hay que hacer: el
        # push sirve para compilar y nada mas.
        if: ${{ inputs.publicar == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          apk=$(ls QBasCopier.Android/bin/Release/net8.0-android*/*.apk | head -1)
          # El nombre ya no lleva "&" (lo convertia GitHub en "." al publicar el
          # asset), asi que el archivo de release y el local son el mismo:
          # QBasWing-Shuttle-v1.2.apk
          cp "$apk" "QBasWing-Shuttle-v1.2.apk"
          gh release delete v1.2-apk --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create v1.2-apk "QBasWing-Shuttle-v1.2.apk" --title "QBasWing Shuttle · QBasCopier y Transfer 1.2" --notes "Version Android para celular. Compilada con GitHub Actions."

  # ---------------------------------------------------------------- escritorio
  # El .exe de PC es un entregable aparte: mismo codigo, otro TFM (net10.0) y otro SDK.
  build_exe:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publicar el .exe de Windows (portatil, un solo archivo)
        run: |
          set -o pipefail
          dotnet publish "QBasCopier/QBasCopier.csproj" -c Release -r win-x64 \
            --self-contained true -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o dist/windows 2>&1 | tee /tmp/build.log
          ls -la dist/windows

      - name: Dejar el log de compilacion en el repo
        if: ${{ failure() }}
        run: |
          set +e
          {
            echo "# Log de compilacion"
            echo
            echo "Commit: ${{ github.sha }}"
            echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            cat /tmp/build.log
            echo '```'
          } > LOG-DE-COMPILACION.md
          git config user.name  "CI"
          git config user.email "ci@localhost"
          git add LOG-DE-COMPILACION.md
          git commit -m "log de compilacion del run ${{ github.run_id }}" || true
          git push origin HEAD:${{ github.ref_name }} || true

      - name: Empaquetar en ZIP
        run: |
          set -e
          cp dist/windows/QBasCopier.exe "dist/windows/QBasWing-Shuttle.exe"
          cd dist && zip -q -r "../QBasWing-Shuttle-v1.2-win-x64.zip" windows
          cd ..
          ls -la QBasWing-Shuttle-v1.2-win-x64.zip

      - name: Subir el .exe como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: QBasWing-Shuttle-v1.2-win-x64
          path: QBasWing-Shuttle-v1.2-win-x64.zip
          if-no-files-found: error

      - name: Publicar el .exe en un release
        if: ${{ inputs.publicar == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release delete v1.2-win --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create v1.2-win "QBasWing-Shuttle-v1.2-win-x64.zip" \
            --title "QBasWing Shuttle · QBasCopier y Transfer 1.2 para Windows" \
            --notes "Portable de 64 bits. Descomprime y ejecuta QBasWing-Shuttle.exe. No necesita instalar nada."
